version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=lunar_production_jwt_secret_key_2026_super_secure
      - POSTGRES_HOST=db
      - POSTGRES_USER=lunar_admin
      - POSTGRES_PASSWORD=lunar_secure_pass
      - POSTGRES_DB=lunar_db
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: lunar_admin
      POSTGRES_PASSWORD: lunar_secure_pass
      POSTGRES_DB: lunar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
