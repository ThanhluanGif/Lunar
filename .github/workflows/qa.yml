name: QA Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lunar_admin
          POSTGRES_PASSWORD: qa_postgres_password
          POSTGRES_DB: lunar_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lunar_admin -d lunar_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --include=optional

      - name: Audit all installed dependencies
        run: npm audit --audit-level=high

      - name: Verify Mac UI and Acer backend integration
        run: npm run qa
        env:
          DATABASE_URL: postgresql://lunar_admin:qa_postgres_password@localhost:5432/lunar_db
          ADMIN_BOOTSTRAP_TOKEN: qa-one-time-admin-bootstrap-token

      - name: Run security regression gates
        run: npm run qa:security

      - name: Validate production container
        run: docker build -t lunar:qa .
