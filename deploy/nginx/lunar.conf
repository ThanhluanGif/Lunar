# Include this file from the nginx http context (for example /etc/nginx/conf.d).
log_format lunar_json escape=json
  '{"timestamp":"$time_iso8601",'
  '"level":"INFO",'
  '"correlation_id":"$request_id",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status":$status,'
  '"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time"}';

upstream lunar_app {
  server app:5000;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  access_log /var/log/nginx/lunar-access.log lunar_json;
  error_log /var/log/nginx/lunar-error.log warn;

  location / {
    proxy_pass http://lunar_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Never trust the public client header. nginx creates the ID and the app
    # accepts it only because this hop is configured as a trusted proxy.
    proxy_set_header X-Correlation-ID $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}
